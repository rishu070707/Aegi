# ─────────────────────────────────────────────────────────────────────────────
# YOLOv8 Training Hyperparameters — Weapon Detection
# Paper Section V-B: "Training Configuration"
# ─────────────────────────────────────────────────────────────────────────────

# Optimizer (paper: "SGD with momentum=0.937 and weight_decay=5×10⁻⁴")
optimizer: SGD
lr0: 0.01            # initial learning rate
lrf: 0.1             # final LR = lr0 * lrf = 0.001 (via cosine annealing)
momentum: 0.937
weight_decay: 0.0005
cos_lr: true         # cosine annealing schedule (lr decays from 0.01 to 0.001)

# Training schedule
epochs: 100          # max epochs per fold
batch: 16            # batch size (paper: "16 images per GPU step")
imgsz: 640           # input resolution 640×640
patience: 15         # early stopping: 15 consecutive non-improving epochs

# Augmentations (paper Section IV-A)
mosaic: 0.9          # mosaic augmentation p=0.9
mixup: 0.15          # Mixup blending p=0.15
fliplr: 0.5          # horizontal flip p=0.5
translate: 0.1       # translation ±10%
scale: 0.5           # random scaling ±50%
hsv_h: 0.015         # hue jitter ±0.015
hsv_s: 0.7           # saturation jitter ±0.7
hsv_v: 0.4           # value jitter ±0.4
erasing: 0.3         # random erasing p=0.3 (simulates partial occlusion)
degrees: 0.0         # rotation (not mentioned in paper, disabled)

# Evaluation / NMS (paper Section IV-B)
conf: 0.25           # confidence threshold
iou: 0.45            # NMS IoU threshold
